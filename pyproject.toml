[project]
name = "vk-service"
version = "0.1.0"
description = "VK delivery channel service for EqSiteCMS (Clean Architecture, PostgreSQL, Celery, NATS JetStream)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.14.3",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "celery[redis]>=5.6.3",
    "dependency-injector>=4.49.1",
    "fastapi>=0.116",
    "nats-py>=2.15.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.10",
    "sentry-sdk[fastapi,sqlalchemy]>=2.47",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.35",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "prometheus-client>=0.26.0",
    "vkbottle>=4.11,<5",
]

[dependency-groups]
dev = [
    "basedpyright>=1.32",
    "flake8>=7.3",
    "httpx2>=0.1",
    "mypy>=2.2",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -m 'not infrastructure'"
markers = [
    "infrastructure: requires local infrastructure, another service, an external provider, or secrets",
]

[tool.ruff]
line-length = 119
target-version = "py314"
extend-exclude = [".github", ".helm"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "bot",
    "clients",
    "containers",
    "core",
    "depends",
    "models",
    "repositories",
    "settings",
    "utils",
    "workers",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.basedpyright]
include = ["src"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingModuleSource = "error"
reportImportCycles = "warning"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true
